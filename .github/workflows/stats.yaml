name: readme
on:
  workflow_dispatch:
  schedule:
    # Runs every 12 hours
    - cron: "0 0 */2 * *"
jobs:
  update-readme:
    name: update readme
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          BLOCKS: ⣀⣄⣤⣦⣶⣷⣿
          SHOW_TIME: true
          SHOW_MASKED_TIME: true
          LANG_COUNT: 10
          SHOW_TITLE: true
